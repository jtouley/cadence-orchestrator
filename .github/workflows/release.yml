name: Release

# Publishing starts when the repo owner pushes a vX.Y.Z tag on main. The `verify` job checks the tag and runs the
# tests without any publishing rights; the `publish` job then runs in the `npm-release` environment, which requires
# the owner's approval (see CONTRIBUTING), and publishes with npm trusted publishing (OIDC): no npm token is stored
# or passed. npm adds provenance automatically, so the npm version links back to this run, commit and tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          python-version: "3.13" # sets UV_PYTHON; the one place this job picks its Python
          enable-cache: false # no cache shared with other workflows in the release path
      - name: Tag matches package.json version
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
          # Prereleases (1.2.3-rc.1) go to the `next` dist-tag, never `latest`.
          case "$version" in *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;; *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;; esac
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA isn't on main" >&2
            exit 1
          fi
      - name: Version isn't on npm yet
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; bump the version instead of re-tagging" >&2
            exit 1
          fi
      # Dev tools from uv.lock (pinned by version and hash), as in CI.
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest
      - run: node .github/scripts/check-pack.mjs

  publish:
    needs: verify
    runs-on: ubuntu-latest # trusted publishing needs a GitHub-hosted runner
    environment: npm-release # must match the trusted publisher on npmjs.com
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance; only this job gets it
    env:
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0; dist-tags with OIDC need npm >= 11.21.0.
      # Pinned by version and by the registry's sha512 integrity, checked before installing.
      NPM_VERSION: "11.21.1"
      NPM_INTEGRITY: "sha512-YTzL6QBEJXyHcTu0JiUc7RKMp+mzlJtl7rGLmERaXUQeFHIMc9atdr6G9M9C8vDWbv40epoTQAzNL2/PtZVDhQ=="
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No registry-url: it would write an .npmrc expecting NODE_AUTH_TOKEN. npm's default registry is npmjs.org.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install pinned npm
        run: |
          tarball="$(npm pack "npm@$NPM_VERSION" --pack-destination "$RUNNER_TEMP" --silent)"
          actual="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/$tarball" | base64 -w0)"
          if [ "$actual" != "$NPM_INTEGRITY" ]; then
            echo "npm $NPM_VERSION tarball integrity $actual doesn't match the pinned $NPM_INTEGRITY" >&2
            exit 1
          fi
          npm install --global --ignore-scripts "$RUNNER_TEMP/$tarball"
      - name: Check npm and Node versions
        run: |
          node -e '
            const [maj, min] = process.versions.node.split(".").map(Number);
            if (maj < 22 || (maj === 22 && min < 14)) { console.error(`Node ${process.version} < 22.14.0`); process.exit(1); }
          '
          if [ "$(npm --version)" != "$NPM_VERSION" ]; then
            echo "npm is $(npm --version), expected $NPM_VERSION" >&2
            exit 1
          fi
          echo "node $(node --version), npm $(npm --version)"
      - name: Publish to npm (trusted publishing)
        run: npm publish --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
