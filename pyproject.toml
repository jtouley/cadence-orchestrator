# Dev tooling only. The runtime (core/scripts, adapters/*/shim.py) is stdlib-only Python and isn't packaged
# here; the installer ships through npm (package.json).
[tool.pytest.ini_options]
testpaths = ["core/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Long lines are left to the formatter; strings and URLs it can't wrap are fine.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Shims add their own directory to sys.path before importing runtime.
"adapters/*/shim.py" = ["E402"]
"core/scripts/runtime.py" = ["E402"]
