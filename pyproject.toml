# Dev tooling only. The runtime (skills/tpm/scripts, adapters/*/shim.py) is stdlib-only Python and isn't packaged
# here; the installer ships through npm (package.json). Users never need uv; contributors and CI use it:
# `uv sync --locked --group dev`, then `uv run pytest` and `uv run pre-commit run --all-files` (uv.lock pins all).
[project]
# A virtual project for uv only: never built or published (the package is on npm).
name = "cadence-orchestrator-dev"
version = "0"
requires-python = ">=3.10"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
    # pre-commit 4.7.0 needs Python 3.11+; on 3.10 the group installs pytest only.
    "pre-commit==4.7.0 ; python_version >= '3.11'",
]

[tool.pytest.ini_options]
testpaths = ["tests", "evals/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Long lines are left to the formatter; strings and URLs it can't wrap are fine.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Shims add their own directory to sys.path before importing runtime.
"adapters/*/shim.py" = ["E402"]
"skills/tpm/scripts/runtime.py" = ["E402"]
